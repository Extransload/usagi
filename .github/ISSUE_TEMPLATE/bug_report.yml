name: Bug report
description: Something in Usagi does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form; see [SECURITY.md](https://github.com/Extransload/usagi/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: usagi-version
    attributes:
      label: Usagi version
      description: "Run `defaults read /Applications/Usagi.app/Contents/Info CFBundleShortVersionString` (use `~/Applications` for a source install)."
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "Run `sw_vers -productVersion`."
      placeholder: "15.6"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Homebrew (brew install --cask extransload/tap/usagi)
        - From source (./install.sh)
        - Downloaded the zip from GitHub
    validations:
      required: true
  - type: textarea
    id: cli-versions
    attributes:
      label: CLI versions
      description: "Output of `claude --version` and `codex --version` (write \"not installed\" for a CLI you don't use)."
      render: text
  - type: textarea
    id: update-log
    attributes:
      label: Update log (for update problems)
      description: "If an update failed or hung, paste the output of `tail -n 40 ~/.config/usagi/update.log`."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed email addresses, tokens and other personal details from what I pasted.
          required: true
