<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme:light;
  --ink:#202124;--muted:#62656b;--dim:#777b82;--line:rgba(70,74,82,.16);
  --card:rgba(255,255,255,.48);--control:rgba(255,255,255,.38);--control-strong:rgba(255,255,255,.72);
  --shadow:rgba(23,27,37,.08);--blue:#3278de;--peach:#d97853;--amber:#b98123;--red:#c94f62;
}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;
  --ink:#f5f5f7;--muted:#c1c3ca;--dim:#a4a6af;--line:rgba(255,255,255,.19);
  --card:rgba(255,255,255,.105);--control:rgba(255,255,255,.09);--control-strong:rgba(255,255,255,.17);
  --shadow:rgba(0,0,0,.14);--blue:#82b8ff;--peach:#f5a47e;--amber:#f4cc78;--red:#ff8fa4;
}}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:transparent;color:var(--ink);font:12px/1.3 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
.shell{height:100%;display:flex;flex-direction:column;padding:13px 13px 9px}
.mast{display:flex;flex:none;align-items:center;gap:10px;margin-bottom:9px}
#cards{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -13px;padding:0 13px 2px}
.state{flex:none;border-radius:5px;padding:1px 5px;font-size:9px;font-weight:650;background:var(--control);color:var(--muted)}.state.on{color:#46ad77;background:rgba(70,173,119,.15)}
.nav-group{display:flex;flex:none;align-items:center;gap:3px}.nav-group .count{min-width:22px;text-align:center;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.nav{width:20px;height:22px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--control);color:var(--ink);font-size:13px;line-height:1}
.slide.from-right{animation:slide-right .18s ease}.slide.from-left{animation:slide-left .18s ease}@keyframes slide-right{from{opacity:.2;transform:translateX(16px)}}@keyframes slide-left{from{opacity:.2;transform:translateX(-16px)}}@media(prefers-reduced-motion:reduce){.slide{animation:none!important}}
.connection-state .login-error{flex:1;min-width:0;color:var(--red);font-size:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
h1{font-size:16px;letter-spacing:-.4px;line-height:1.1;margin:1px 0 0}
.spacer{flex:1}.icon-button{border:1px solid var(--line);background:var(--control);color:var(--ink);width:28px;height:28px;border-radius:10px;font-size:16px;line-height:1;backdrop-filter:blur(16px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 12px 9px;margin-bottom:7px;box-shadow:0 6px 18px var(--shadow);backdrop-filter:blur(20px) saturate(1.25)}
.card.connecting{min-height:88px}.connection-state{display:flex;align-items:center;gap:7px;margin:12px 0 2px;color:var(--muted);font-size:11px}.connection-state .spinner{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--peach);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.card-head{display:flex;align-items:center;gap:8px}.glyph{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;overflow:hidden;flex:none}.glyph img{width:100%;height:100%;object-fit:cover}
.brand{font-size:14px;font-weight:720}.account-picker{min-width:0;background:var(--control);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 7px;max-width:140px;font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(12px)}
.identity{display:flex;gap:7px;align-items:center;margin:5px 0 7px;padding-left:1px;color:var(--muted);font-size:10px;min-height:13px}
.identity .email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plan{border-radius:5px;background:var(--control);padding:1px 5px;color:var(--ink);font-size:9px}
.meter{margin:0 0 8px}.meter-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}.meter-title b{font-size:10px;font-weight:600}.pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:10px;background:var(--line);overflow:hidden}.fill{height:100%;border-radius:10px;transition:width .35s ease}.meter-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:3px;font-variant-numeric:tabular-nums}
.empty{color:var(--dim);font-size:10px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}.status-dot.online{background:#46ad77}.account-strip{border-top:1px solid var(--line);padding-top:6px;margin-top:3px;display:flex;align-items:center;justify-content:flex-end}
.account-actions{display:flex;gap:5px;align-items:center}.action-icon{width:28px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--control);color:var(--muted);padding:0}.action-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.action-icon.active{color:#46ad77}.action-icon.signin{color:var(--blue)}.claude .action-icon.signin{color:var(--peach)}.action-icon.danger{color:var(--red)}
.footer{display:flex;flex:none;gap:8px;align-items:center;padding:3px 3px 0;color:var(--muted);font-size:10px}.footer .icon-button{border:1px solid var(--line);background:var(--control);color:var(--ink);padding:0}.footer .spacer{flex:1}
.error{background:var(--control-strong);color:var(--red);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:10px}
.overlay{position:fixed;inset:0;background:rgba(17,17,27,.57);display:none;align-items:center;justify-content:center;padding:22px}.overlay.show{display:flex}
.dialog{background:var(--control-strong);border:1px solid var(--line);border-radius:15px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(17,17,27,.25);backdrop-filter:blur(30px)}
.dialog h2{font-size:16px;margin:0 0 5px}.dialog p{font-size:11px;color:var(--muted);margin:0 0 14px}.dialog input{width:100%;border:1px solid var(--line);background:var(--control);color:var(--ink);border-radius:8px;padding:9px;outline:none}
.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.dialog-head h2{margin:0}.provider-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.provider-option{display:flex;align-items:center;flex-direction:column;gap:9px;justify-content:center;min-height:112px;border:1px solid var(--line);border-radius:13px;background:var(--control);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}.provider-option:hover,.provider-option:focus-visible{background:var(--card);outline:2px solid var(--blue);outline-offset:1px}.provider-option img{width:38px;height:38px;border-radius:9px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dialog-actions button{border-radius:8px;padding:7px 11px;border:1px solid var(--line);background:var(--control);color:var(--ink)}
.dialog-actions .primary{background:var(--blue);border-color:var(--blue);color:white}.dialog-actions .danger{background:var(--red);border-color:var(--red);color:white}
</style></head><body>
<div class="shell">
  <div class="mast"><h1>사용량</h1><div class="spacer"></div><button class="icon-button" onclick="send('snapshot')" title="새로고침" aria-label="새로고침">↻</button></div>
  <div id="cards"><div class="card">불러오는 중…</div></div><div id="error"></div>
  <div class="footer"><button class="icon-button" onclick="showAdd()" title="계정 추가" aria-label="계정 추가">＋</button><span class="spacer"></span><button class="icon-button" onclick="send('quit')" title="종료" aria-label="종료">⏻</button></div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)hideAdd()"><div class="dialog"><div class="dialog-head"><h2>계정 추가</h2><button class="icon-button" onclick="hideAdd()" title="닫기" aria-label="닫기">×</button></div><div class="provider-grid"><button class="provider-option" onclick="addProvider('claude')" aria-label="Claude 계정 추가"><img src="assets/claude.png" alt=""><span>Claude</span></button><button class="provider-option" onclick="addProvider('codex')" aria-label="Codex 계정 추가"><img src="assets/codex.png" alt=""><span>Codex</span></button></div></div></div>
<div class="overlay" id="action-overlay"><div class="dialog"><h2 id="action-title"></h2><div class="dialog-actions"><button onclick="hideAccountAction()">취소</button><button class="danger" onclick="confirmAccountAction()">확인</button></div></div></div>
<script>
let pendingAccountAction=null;
const sourceNames={claude:'Claude',codex:'Codex'};
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function decode(data){return new TextDecoder().decode(Uint8Array.from(atob(data),c=>c.charCodeAt(0)));}
function send(action,provider,account){const payload={action};if(provider)payload.provider=provider;if(account)payload.account=account;window.webkit?.messageHandlers?.agentUsage?.postMessage(payload);}
function pct(value){return `${Math.round(value)}%`}
function countdown(stamp){if(!stamp)return '초기화 시각 없음';let s=Math.max(0,Math.floor(stamp-Date.now()/1000));if(!s)return '초기화됨';if(s>=86400)return `${Math.floor(s/86400)}일 ${Math.floor(s%86400/3600)}시간 후`;if(s>=3600)return `${Math.floor(s/3600)}시간 ${Math.floor(s%3600/60)}분 후`;return `${Math.max(1,Math.floor(s/60))}분 후`}
function age(stamp){if(!stamp)return '갱신 시각 없음';let m=Math.max(0,Math.floor((Date.now()/1000-stamp)/60));return m<1?'방금 갱신':m<60?`${m}분 전 갱신`:`${Math.floor(m/60)}시간 전 갱신`}
function tone(value,source){return value>=80?'var(--red)':value>=50?'var(--amber)':source==='claude'?'var(--peach)':'var(--blue)'}
function icon(name){const paths={signin:'<path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h10"/>',use:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',remove:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`}
function meter(label,reading,source){if(!reading)return '';
 const used=Number(reading.used_percent)||0,stale=reading.captured_at&&Date.now()/1000-reading.captured_at>360*60;
 return `<div class="meter"><div class="meter-title"><b>${escapeHtml(label)}</b><span class="pct" style="color:${tone(used,source)}">${pct(used)}${stale?' · !':''}</span></div><div class="bar"><div class="fill" style="background:${tone(used,source)};width:${Math.min(100,Math.max(0,used))}%"></div></div><div class="meter-meta"><span></span><span>${countdown(reading.resets_at)}</span></div></div>`}
function windowLabel(key){return key==='fable'?'Fable':/^\d+d$/.test(key)?`${parseInt(key)}일`:/^\d+h$/.test(key)?`${parseInt(key)}시간`:key}
function card(source,active,isActive,nav=''){if(!active)return '';
 const label=`${sourceNames[source]} · ${active.id}`;
 const state=`<span class="state ${isActive?'on':''}" title="${isActive?'현재 시스템 CLI 계정':'시스템 CLI 계정 아님'}">${isActive?'활성':'비활성'}</span>`;
 const sourceTitle=active.source||'CLI 사용량 없음';
 if(!active.logged_in){const status=active.connecting?'<span class="spinner"></span>연결 중…':active.login_error?`<span class="login-error" title="${escapeHtml(active.login_error)}">로그인 실패: ${escapeHtml(active.login_error)}</span>`:'로그인 필요';const action=`<button class="action-icon signin" onclick="send('login','${source}','${escapeHtml(active.id)}')" title="${label} ${active.connecting?'다시 열기':'로그인'}" aria-label="${label} ${active.connecting?'다시 열기':'로그인'}">${icon('signin')}</button>`;return `<section class="card connecting ${source}"><div class="card-head"><div class="glyph"><img src="assets/${source}.png" alt=""></div><div class="brand">${sourceNames[source]}</div>${state}<div class="spacer"></div><span class="account-picker">${escapeHtml(active.id)}</span>${nav}</div><div class="connection-state">${status}<div class="spacer"></div>${action}<button class="action-icon danger" onclick="showAccountAction('${source}','${escapeHtml(active.id)}')" title="${label} 제거" aria-label="${label} 제거">${icon('remove')}</button></div></section>`}
 const identity=active.logged_in&&active.email?`<div class="identity"><span class="email">${escapeHtml(active.email)}</span>${active.plan?`<span class="plan">${escapeHtml(active.plan)}</span>`:''}</div>`:'';
 let meters='';
 if(active.logged_in){const windows=active.windows||{};const extraKeys=Object.keys(windows).filter(k=>k!=='5h'&&k!=='7d').sort((a,b)=>(windows[b]?.used_percent||0)-(windows[a]?.used_percent||0));meters=meter('5시간',windows['5h'],source)+meter('주간',windows['7d'],source)+extraKeys.slice(0,1).map(k=>meter(windowLabel(k),windows[k],source)).join('')}
 const actions=`<div class="account-actions"><button class="action-icon ${isActive?'active':''}" onclick="send('select','${source}','${escapeHtml(active.id)}')" title="${isActive?'현재 시스템 계정':'시스템 계정으로 사용'}" aria-label="${isActive?'현재 시스템 계정':'시스템 계정으로 사용'}">${icon('use')}</button><button class="action-icon signin" onclick="send('login','${source}','${escapeHtml(active.id)}')" title="${label} 로그인" aria-label="${label} 로그인">${icon('signin')}</button><button class="action-icon danger" onclick="showAccountAction('${source}','${escapeHtml(active.id)}')" title="${label} 제거" aria-label="${label} 제거">${icon('remove')}</button></div>`;
 return `<section class="card ${source}"><div class="card-head"><div class="glyph"><img src="assets/${source}.png" alt=""></div><div class="brand">${sourceNames[source]}</div><span class="status-dot ${active.logged_in?'online':''}" title="${active.logged_in?'CLI 연결됨':'CLI 연결 전'}"></span>${state}<div class="spacer"></div><span class="account-picker" title="${escapeHtml(sourceTitle)}">${escapeHtml(active.id)}</span>${nav}</div>${identity}${meters}<div class="account-strip">${actions}</div></section>`
}
let lastData=null,swipe=0,swipeAt=0,swipeLock=0;const carouselPos={};
function requestSize(){requestAnimationFrame(()=>{const cards=document.getElementById('cards');send('resize',null,String(Math.ceil(document.querySelector('.footer').getBoundingClientRect().bottom+9+cards.scrollHeight-cards.clientHeight)))})}
function groups(data){const order=[],byProvider={};for(const item of data.cards||[]){const account=(data.providers?.[item.provider]?.accounts||[]).find(a=>a.id===item.id);if(!account)continue;if(!byProvider[item.provider]){byProvider[item.provider]=[];order.push(item.provider)}byProvider[item.provider].push(account)}
 return order.map(source=>({source,active:data.providers[source].active,accounts:byProvider[source].sort((a,b)=>(b.id==='default')-(a.id==='default'))}))}
function carousel(group,motion){const {source,active,accounts}=group;const index=Math.max(0,accounts.findIndex(a=>a.id===carouselPos[source]));carouselPos[source]=accounts[index].id;
 const nav=accounts.length>1?`<span class="nav-group"><button class="nav" onclick="rotate('${source}',-1)" title="이전 계정" aria-label="이전 계정">‹</button><span class="count">${index+1}/${accounts.length}</span><button class="nav" onclick="rotate('${source}',1)" title="다음 계정" aria-label="다음 계정">›</button></span>`:'';
 return `<div class="carousel" data-provider="${source}"><div class="slide ${motion||''}">${card(source,accounts[index],accounts[index].id===active,nav)}</div></div>`}
function render(moved,step){if(!lastData)return;document.getElementById('cards').innerHTML=groups(lastData).map(g=>carousel(g,g.source===moved?(step<0?'from-left':'from-right'):'')).join('');requestSize()}
function rotate(source,step){const group=lastData&&groups(lastData).find(g=>g.source===source);if(!group||group.accounts.length<2)return;const index=Math.max(0,group.accounts.findIndex(a=>a.id===carouselPos[source]));carouselPos[source]=group.accounts[(index+step+group.accounts.length)%group.accounts.length].id;render(source,step)}
window.receiveSnapshot=function(encoded){try{lastData=JSON.parse(decode(encoded));render();const node=document.getElementById('error');node.className='';node.textContent='';hideAdd()}catch(error){document.getElementById('error').textContent=String(error)}};
window.receiveError=function(encoded){const node=document.getElementById('error');node.className='error';node.textContent=decode(encoded);requestSize()};
document.getElementById('cards').addEventListener('wheel',event=>{const box=event.target.closest('.carousel');if(!box||Math.abs(event.deltaX)<=Math.abs(event.deltaY))return;event.preventDefault();if(Date.now()<swipeLock)return;if(Date.now()-swipeAt>200)swipe=0;swipeAt=Date.now();swipe+=event.deltaX;if(Math.abs(swipe)>40){rotate(box.dataset.provider,swipe>0?1:-1);swipe=0;swipeLock=Date.now()+450}},{passive:false});
function showAccountAction(provider,account){pendingAccountAction={provider,account};document.getElementById('action-title').textContent=`${sourceNames[provider]} · ${account} 제거?`;document.getElementById('action-overlay').classList.add('show')}
function hideAccountAction(){pendingAccountAction=null;document.getElementById('action-overlay').classList.remove('show')}
function confirmAccountAction(){if(!pendingAccountAction)return;const {provider,account}=pendingAccountAction;hideAccountAction();send('remove',provider,account)}
function showAdd(){document.getElementById('overlay').classList.add('show');document.querySelector('.provider-option').focus()}
function hideAdd(){document.getElementById('overlay').classList.remove('show')}
function addProvider(provider){hideAdd();send('add_auto',provider)}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){hideAdd();hideAccountAction()}});
</script></body></html>
